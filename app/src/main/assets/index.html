<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="编程助教">
<meta name="theme-color" content="#1a1a2e">
<link rel="manifest" href="./manifest.json">
<title>🐶 豆豆编程助教</title>
<style>
  :root {
    --bg: #1a1a2e;
    --surface: #16213e;
    --surface2: #0f3460;
    --accent: #e94560;
    --accent2: #00d2ff;
    --text: #e0e0e0;
    --text2: #a0a0b0;
    --green: #00e676;
    --yellow: #ffd740;
    --red: #ff5252;
    --radius: 10px;
    --safe-bottom: env(safe-area-inset-bottom, 8px);
  }

  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

  body {
    font-family: 'Segoe UI', 'Microsoft YaHei', -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    min-height: 100dvh;
    font-size: 15px;
    padding-bottom: calc(64px + var(--safe-bottom));
    -webkit-font-smoothing: antialiased;
  }

  /* Header */
  .header {
    background: linear-gradient(135deg, var(--surface2), var(--surface));
    padding: 12px 16px;
    display: flex; align-items: center; gap: 10px;
    border-bottom: 2px solid var(--accent);
    position: sticky; top: 0; z-index: 100;
    backdrop-filter: blur(10px);
  }
  .header .logo { font-size: 28px; }
  .header h1 { font-size: 18px; color: #fff; line-height: 1.2; }
  .header .sub { font-size: 11px; color: var(--text2); }

  /* 主内容 */
  .main {
    max-width: 800px; margin: 0 auto;
    padding: 12px;
  }

  .panel { display: none; }
  .panel.active { display: block; }

  /* 卡片 */
  .card {
    background: var(--surface);
    border-radius: var(--radius);
    padding: 14px; margin-bottom: 12px;
    border: 1px solid #2a2a4a;
  }
  .card h3 {
    font-size: 15px; margin-bottom: 10px;
    color: var(--accent2); display: flex; align-items: center; gap: 6px;
  }

  /* 输入框 */
  textarea {
    width: 100%; background: #0d1117; color: #c9d1d9;
    border: 1px solid #30363d; border-radius: 8px;
    padding: 12px; font-size: 14px;
    font-family: 'Consolas', 'Microsoft YaHei', monospace;
    resize: vertical; line-height: 1.5;
    min-height: 160px;
  }
  textarea:focus { outline: none; border-color: var(--accent2); }

  .input-label {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 6px; font-weight: 600; font-size: 14px;
  }

  /* 按钮 */
  .btn {
    padding: 10px 16px; border: none; border-radius: 8px;
    font-size: 14px; cursor: pointer; font-weight: 600;
    transition: all 0.15s; font-family: inherit;
    touch-action: manipulation; min-height: 44px;
    display: inline-flex; align-items: center; gap: 4px;
    white-space: nowrap;
  }
  .btn:active { transform: scale(0.96); }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-secondary { background: var(--surface2); color: var(--accent2); border: 1px solid var(--accent2); }
  .btn-sm { padding: 8px 12px; font-size: 13px; min-height: 36px; }
  .btn-block { width: 100%; justify-content: center; }
  .btn-group { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }

  /* 输出区域 */
  .output {
    background: #0d1117; border: 1px solid #30363d;
    border-radius: 8px; padding: 14px; min-height: 120px;
    font-family: 'Microsoft YaHei', sans-serif;
    line-height: 1.7; white-space: pre-wrap;
    font-size: 14px; overflow-x: auto;
  }
  .code-block {
    background: #0d1117; border: 1px solid #30363d;
    border-radius: 8px; padding: 12px; margin: 8px 0;
    font-family: 'Consolas', monospace; font-size: 13px;
    line-height: 1.5; overflow-x: auto; white-space: pre-wrap;
  }

  /* 语法高亮颜色 */
  .hl-kw { color: #ff7b72; }
  .hl-fn { color: #d2a8ff; }
  .hl-str { color: #a5d6ff; }
  .hl-cmt { color: #8b949e; }
  .hl-num { color: #79c0ff; }
  .hl-macro { color: #ff7b72; }

  .output .warn { color: var(--yellow); }
  .output .error { color: var(--red); }
  .output .success { color: var(--green); }
  .output .info { color: var(--accent2); }
  .output .text2 { color: var(--text2); }
  .output .line-num { color: #6e7681; margin-right: 6px; user-select: none; font-size: 12px; }
  .output .explain { color: #7ee787; }

  /* 错误卡片 */
  .error-card {
    background: #2d1518; border: 1px solid #5a1e1e;
    border-radius: 8px; padding: 12px; margin: 6px 0;
  }
  .error-card .err-type { color: var(--red); font-weight: 700; }
  .error-card .err-msg { color: #ff9999; margin-top: 2px; font-size: 13px; }
  .error-card .err-fix { color: var(--green); margin-top: 4px; font-size: 13px; }

  /* 模板网格 */
  .template-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
    gap: 8px;
  }
  .tpl-card {
    background: var(--surface2); border-radius: 8px; padding: 12px 8px;
    cursor: pointer; border: 1px solid transparent;
    text-align: center; transition: all 0.15s;
    touch-action: manipulation;
  }
  .tpl-card:active { transform: scale(0.95); border-color: var(--accent2); }
  .tpl-card .tpl-icon { font-size: 24px; margin-bottom: 4px; }
  .tpl-card .tpl-name { font-weight: 600; color: #fff; font-size: 13px; }
  .tpl-card .tpl-desc { font-size: 11px; color: var(--text2); margin-top: 2px; }

  /* 底部导航栏 */
  .bottom-nav {
    position: fixed; bottom: 0; left: 0; right: 0;
    background: var(--surface);
    border-top: 1px solid #2a2a4a;
    display: flex; z-index: 200;
    padding-bottom: var(--safe-bottom);
    backdrop-filter: blur(10px);
  }
  .nav-item {
    flex: 1; display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    padding: 8px 4px; cursor: pointer;
    color: var(--text2); font-size: 10px;
    border: none; background: none;
    transition: color 0.2s; font-family: inherit;
    touch-action: manipulation; gap: 2px;
  }
  .nav-item .nav-icon { font-size: 20px; }
  .nav-item.active { color: var(--accent2); }
  .nav-item:active { background: rgba(0,210,255,0.08); }

  /* 加载 */
  .spinner {
    display: inline-block; width: 16px; height: 16px;
    border: 2px solid var(--text2); border-top-color: var(--accent2);
    border-radius: 50%; animation: spin 0.6s linear infinite;
    vertical-align: middle; margin-right: 6px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .status { font-size: 12px; color: var(--text2); margin-top: 6px; display: flex; align-items: center; gap: 6px; }

  /* API 配置 */
  .api-config { display: none; margin-top: 10px; }
  .api-config.show { display: block; }
  .api-config input {
    width: 100%; padding: 10px; background: #0d1117; border: 1px solid #30363d;
    border-radius: 6px; color: #c9d1d9; font-size: 13px; margin: 4px 0;
  }

  /* 平板适配 */
  @media (min-width: 768px) {
    body { font-size: 16px; }
    .main { padding: 20px; }
    .header { padding: 16px 24px; }
    .header h1 { font-size: 22px; }
    .card { padding: 18px; }
    .tpl-card .tpl-icon { font-size: 28px; }
    .tpl-card .tpl-name { font-size: 14px; }
    .row { display: flex; gap: 14px; }
    .col { flex: 1; min-width: 0; }
    textarea { min-height: 200px; font-size: 15px; }
  }

  /* 横屏平板 */
  @media (min-width: 1024px) {
    .main { max-width: 1100px; }
    .template-grid { grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); }
  }

  /* 欢迎提示 */
  .welcome {
    text-align: center; padding: 40px 20px;
    color: var(--text2);
  }
  .welcome .icon { font-size: 56px; margin-bottom: 12px; }
  .welcome h2 { color: #fff; font-size: 20px; margin-bottom: 8px; }
  .welcome p { font-size: 14px; line-height: 1.6; }

  .status-hint {
    background: #1a2a1a; border: 2px solid var(--green);
    border-radius: 10px; padding: 16px; text-align: center;
    margin-top: 10px;
  }
</style>
</head>
<body>

<div class="header">
  <span class="logo">🐶</span>
  <div>
    <h1>豆豆编程助教</h1>
    <div class="sub">ESP32 / Arduino 课堂工具</div>
  </div>
</div>

<div class="main">

<!-- ============ 代码解读 ============ -->
<div id="panel-explain" class="panel active">
  <div class="card">
    <div class="input-label"><span>📥 粘贴代码</span></div>
    <textarea id="explain-input" placeholder="粘贴学生代码...&#10;&#10;void setup() {&#10;  pinMode(2, OUTPUT);&#10;}&#10;void loop() {&#10;  digitalWrite(2, HIGH);&#10;  delay(1000);&#10;  digitalWrite(2, LOW);&#10;  delay(1000);&#10;}"></textarea>
    <div class="btn-group">
      <button class="btn btn-primary btn-block" onclick="explainCode()">🔍 解读代码</button>
      <button class="btn btn-secondary btn-block" onclick="explainWithAI()">💬 求助豆豆解读</button>
    </div>
  </div>
  <div class="card">
    <h3>📤 解读结果</h3>
    <div id="explain-output" class="output">
      <div class="welcome">
        <div class="icon">📖</div>
        <p>粘贴 Arduino / ESP32 代码<br>点击"解读代码"查看逐行分析</p>
      </div>
    </div>
    <div id="explain-status" class="status"></div>
  </div>
</div>

<!-- ============ 错误分析 ============ -->
<div id="panel-debug" class="panel">
  <div class="card">
    <div class="input-label"><span>📥 代码</span></div>
    <textarea id="debug-code" placeholder="粘贴有问题的代码..."></textarea>
  </div>
  <div class="card">
    <div class="input-label"><span>📥 错误信息（可选）</span></div>
    <textarea id="debug-error" placeholder="粘贴编译器报错...&#10;error: expected ';' before '}'" style="min-height:80px;"></textarea>
  </div>
  <div class="btn-group">
    <button class="btn btn-primary btn-block" onclick="analyzeErrors()">🔍 分析错误</button>
    <button class="btn btn-secondary btn-block" onclick="analyzeWithAI()">💬 求助豆豆分析</button>
  </div>
  <div class="card" style="margin-top:12px;">
    <h3>📤 分析结果</h3>
    <div id="debug-output" class="output">
      <div class="welcome">
        <div class="icon">🔍</div>
        <p>粘贴代码和错误信息<br>点击"分析错误"自动检测问题</p>
      </div>
    </div>
    <div id="debug-status" class="status"></div>
  </div>
</div>

<!-- ============ 思路编程 ============ -->
<div id="panel-generate" class="panel">
  <div class="card">
    <div class="input-label"><span>💬 想做什么？</span></div>
    <textarea id="generate-idea" placeholder="用日常语言描述...&#10;&#10;例如：&#10;• 让LED每隔1秒闪烁&#10;• 按下按钮LED亮，松开灭&#10;• 超声波测距显示在串口"></textarea>
    <div class="btn-group">
      <button class="btn btn-primary btn-block" onclick="generateCode()">💡 生成代码</button>
      <button class="btn btn-secondary btn-block" onclick="generateWithAI()">💬 求助豆豆生成</button>
    </div>
  </div>
  <div class="card">
    <h3>📋 常用模板（点一下填充）</h3>
    <div class="template-grid" id="template-grid"></div>
  </div>
  <div class="card">
    <h3>📤 生成的代码</h3>
    <div id="generate-output" style="min-height:120px;">
      <div class="welcome">
        <div class="icon">💡</div>
        <p>描述想做的事情<br>或点击上方模板</p>
      </div>
    </div>
    <div id="generate-status" class="status"></div>
    <div class="btn-group" id="generate-actions" style="display:none;">
      <button class="btn btn-primary btn-sm" onclick="copyGeneratedCode()">📋 复制</button>
      <button class="btn btn-secondary btn-sm" onclick="explainGeneratedCode()">🔍 解读</button>
    </div>
  </div>
</div>

<!-- ============ 速查手册 ============ -->
<div id="panel-learn" class="panel">
  <div class="card">
    <h3>📚 Arduino / ESP32 函数速查</h3>
    <div id="quickref-content"></div>
  </div>
</div>

<!-- API 配置 -->
<div class="card" style="margin-top:8px;">
  <button class="btn btn-secondary btn-sm btn-block" onclick="toggleAPIConfig()">⚙️ AI增强设置</button>
  <div class="api-config" id="api-config">
    <p style="color:var(--text2); font-size:12px; margin:8px 0;">
      已预置 DeepSeek API，开箱即用。也可更换其他兼容接口。
    </p>
    <label style="font-size:12px; color:var(--text2);">API 地址</label>
    <input type="text" id="api-url">
    <label style="font-size:12px; color:var(--text2);">API Key</label>
    <input type="password" id="api-key">
    <label style="font-size:12px; color:var(--text2);">模型名</label>
    <input type="text" id="api-model">
    <button class="btn btn-primary btn-sm btn-block" onclick="saveAPIConfig()" style="margin-top:8px;">💾 保存</button>
  </div>
</div>

</div>

<!-- 底部导航栏 -->
<nav class="bottom-nav">
  <button class="nav-item active" onclick="switchTab('explain')">
    <span class="nav-icon">📖</span> 代码解读
  </button>
  <button class="nav-item" onclick="switchTab('debug')">
    <span class="nav-icon">🔍</span> 错误分析
  </button>
  <button class="nav-item" onclick="switchTab('generate')">
    <span class="nav-icon">💡</span> 思路编程
  </button>
  <button class="nav-item" onclick="switchTab('learn')">
    <span class="nav-icon">📚</span> 速查
  </button>
</nav>

<script>
// ==================== 底部导航 ====================
function switchTab(name) {
  document.querySelectorAll('.nav-item').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
  // 找到对应 nav-item
  const items = document.querySelectorAll('.nav-item');
  const panels = ['explain', 'debug', 'generate', 'learn'];
  const idx = panels.indexOf(name);
  if (idx >= 0 && items[idx]) items[idx].classList.add('active');
  const panel = document.getElementById(`panel-${name}`);
  if (panel) panel.classList.add('active');
  window.scrollTo(0, 0);
}

// 当前生成的代码缓存
let currentGeneratedCode = '';

// ==================== Arduino 知识库 ====================
const ARDUINO_DOC = {
  'pinMode': { desc: '设置引脚模式', params: '引脚号, 模式(INPUT/OUTPUT/INPUT_PULLUP)', detail: '使用数字引脚前必须先设置模式。就像告诉一扇门是让人进来还是出去。', example: 'pinMode(13, OUTPUT);' },
  'digitalWrite': { desc: '数字引脚写高/低电平', params: '引脚号, HIGH/LOW', detail: '给引脚输出高电平(开)或低电平(关)。HIGH=开灯，LOW=关灯。', example: 'digitalWrite(13, HIGH);' },
  'digitalRead': { desc: '读取数字引脚电平', params: '引脚号', detail: '读取引脚状态，返回 HIGH 或 LOW。就像问门铃：有人按了吗？', example: 'int v = digitalRead(3);' },
  'analogWrite': { desc: '模拟输出(PWM)', params: '引脚号, 值(0-255)', detail: '输出模拟信号。0=全关，255=全开。⚠️ ESP32请用 ledcWrite！', example: 'analogWrite(9, 128);', note: '⚠️ ESP32用ledcWrite' },
  'analogRead': { desc: '模拟读取(ADC)', params: '引脚号', detail: '读取模拟传感器电压值。Arduino返回0-1023，ESP32返回0-4095。', example: 'int v = analogRead(A0);' },
  'delay': { desc: '延时等待', params: '毫秒数', detail: '暂停程序指定毫秒（1000毫秒=1秒）。会阻塞程序，进阶用millis()。', example: 'delay(1000);' },
  'Serial.begin': { desc: '初始化串口', params: '波特率(9600/115200)', detail: '启动串口通信。波特率是说话速度，两边要一致。', example: 'Serial.begin(115200);' },
  'Serial.println': { desc: '串口打印换行', params: '内容', detail: '把数据发到电脑串口监视器。就像给电脑发消息。', example: 'Serial.println("Hello!");' },
  'Serial.print': { desc: '串口打印不换行', params: '内容', detail: '类似println但不换行，后面的内容接在后面。', example: 'Serial.print("X:");' },
  'millis': { desc: '获取运行时间(毫秒)', params: '无', detail: '返回程序启动到现在的毫秒数。常用于非阻塞定时。', example: 'unsigned long t = millis();' },
  'tone': { desc: '蜂鸣器发声', params: '引脚, 频率(Hz), 时长(ms)', detail: '让蜂鸣器发出指定频率声音。频率越高音调越高。', example: 'tone(8, 440, 500);' },
  'map': { desc: '数值映射', params: '输入, 输入最小, 输入最大, 输出最小, 输出最大', detail: '按比例映射数值范围。如把0-1023映射到0-180度。', example: 'int a = map(v, 0, 1023, 0, 180);' },
  'constrain': { desc: '数值约束', params: '值, 最小, 最大', detail: '确保数值不超出范围。太小取最小值，太大取最大值。', example: 'int s = constrain(v, 0, 255);' },
  'ledcSetup': { desc: 'ESP32 PWM配置', params: '通道, 频率, 分辨率', detail: 'ESP32设置PWM。先配置再绑引脚再输出。', example: 'ledcSetup(0,5000,8);', note: '仅ESP32' },
  'ledcWrite': { desc: 'ESP32 PWM输出', params: '通道, 值(0-255)', detail: 'ESP32的PWM输出，代替Arduino的analogWrite。', example: 'ledcWrite(0, 200);', note: '仅ESP32' },
  'WiFi.begin': { desc: '连接WiFi', params: 'SSID, 密码', detail: '让ESP32连接WiFi网络。', example: 'WiFi.begin("name","pwd");', note: '仅ESP32' },
  'random': { desc: '生成随机数', params: '最小, 最大', detail: '生成随机数。最小值包含，最大值不包含。', example: 'int r = random(1,7);' },
  'abs': { desc: '取绝对值', params: '数值', detail: '负数变正数。', example: 'int d = abs(-5);' },
  'sizeof': { desc: '变量大小(字节)', params: '变量/类型', detail: '返回变量占用的字节数。', example: 'int s = sizeof(int);' },
};

const ARDUINO_TYPES = {
  'int': '整数，-32768~32767',
  'long': '长整数',
  'float': '小数（浮点数）',
  'char': '单个字符，如\'A\'',
  'byte': '字节，0~255',
  'bool': '布尔值，true/false',
  'String': '字符串（一段文字）',
  'void': '空类型（函数不返回值）',
  'unsigned': '无符号（只存正数）',
};

const ARDUINO_STRUCTURE = {
  'void setup()': '初始化函数 — 开机只执行一次',
  'void loop()': '主循环 — 不断重复执行',
  'if': '条件判断：如果成立就执行',
  'else': '否则：if不成立时执行',
  'for': '循环：重复指定次数',
  'while': '循环：条件成立就重复',
};

// ==================== 代码解读 ====================
function explainCode() {
  const code = document.getElementById('explain-input').value.trim();
  const output = document.getElementById('explain-output');
  if (!code) { output.innerHTML = '<span class="warn">⚠️ 请先粘贴代码</span>'; return; }

  const lines = code.split('\n');
  let html = `<div style="margin-bottom:8px;" class="success">📖 共 ${lines.length} 行，逐行解读：</div>`;

  for (let i = 0; i < lines.length; i++) {
    const trimmed = lines[i].trim();
    if (!trimmed) { html += '<div style="height:6px;"></div>'; continue; }

    // 注释
    if (trimmed.startsWith('//') || trimmed.startsWith('/*') || trimmed.startsWith('*')) {
      html += `<div><span class="line-num">${i+1}</span><span class="hl-cmt">💬 ${escapeHtml(trimmed)}</span></div>`;
      continue;
    }

    // 预处理
    if (trimmed.startsWith('#')) {
      html += `<div><span class="line-num">${i+1}</span><span class="hl-macro">${escapeHtml(trimmed)}</span></div>`;
      continue;
    }

    let found = '';
    // 类型
    for (const [t, d] of Object.entries(ARDUINO_TYPES)) {
      if (trimmed.includes(t + ' ') || trimmed.startsWith(t + ' ')) {
        const m = trimmed.match(new RegExp(t + '\\s+(\\w+)'));
        if (m) found = `<span class="explain">← ${t}变量 <b>${m[1]}</b></span>`;
      }
    }
    // 结构
    for (const [k, d] of Object.entries(ARDUINO_STRUCTURE)) {
      if (trimmed.includes(k.replace('()','')) || trimmed.startsWith(k.split(' ')[0])) {
        if (!found) found = `<span class="explain">← ${d}</span>`;
      }
    }
    // 函数
    for (const [fn, doc] of Object.entries(ARDUINO_DOC)) {
      if (trimmed.includes(fn + '(')) { found = `<span class="explain">← ${doc.desc}</span>`; break; }
    }
    // 赋值
    if (!found && trimmed.includes('=') && !trimmed.includes('==') && !trimmed.includes('!=')) {
      const m = trimmed.match(/^(\w+)\s*=/);
      if (m) found = `<span class="explain">← 给 <b>${m[1]}</b> 赋值</span>`;
    }

    html += `<div><span class="line-num">${i+1}</span>${highlightLine(trimmed)}${found}</div>`;
  }

  // 整体评估
  const full = code.toLowerCase();
  html += '<div style="margin-top:12px;padding:12px;background:#1a2a1a;border-radius:8px;font-size:13px;">';
  html += '<div class="success" style="margin-bottom:6px;">📊 整体分析：</div>';
  html += full.includes('void setup') && full.includes('void loop') ? '<div>✅ 有 setup + loop</div>' : '<div class="warn">⚠️ 缺少 setup 或 loop</div>';
  html += full.includes('pinmode') ? '<div>✅ 有引脚设置</div>' : '<div class="warn">⚠️ 未设置引脚模式</div>';
  html += full.includes('serial.begin') ? '<div>✅ 串口已初始化</div>' : '';
  html += full.includes('delay(') ? '<div>💡 用了delay() — 注意会阻塞</div>' : '';
  html += '</div>';
  output.innerHTML = html;
}

function highlightLine(line) {
  let hl = escapeHtml(line);
  hl = hl.replace(/"([^"]*)"/g, '<span class="hl-str">"$1"</span>');
  hl = hl.replace(/(\/\/.*$)/g, '<span class="hl-cmt">$1</span>');
  const kws = ['void','int','float','char','bool','byte','long','unsigned','const','return','if','else','for','while','true','false','HIGH','LOW','INPUT','OUTPUT'];
  for (const kw of kws) hl = hl.replace(new RegExp('\\b'+kw+'\\b','g'),`<span class="hl-kw">${kw}</span>`);
  hl = hl.replace(/\b(\d+)\b/g, '<span class="hl-num">$1</span>');
  return hl;
}

function escapeHtml(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

const ERROR_PATTERNS = [
  { name:'缺少分号', check:(c)=>{const r=[];c.split('\n').forEach((l,i)=>{const t=l.trim();if(t&&!/[;{}]$/.test(t)&&!/^(\/\/|#|\*|\/\*)/.test(t)&&/\w/.test(t)&&!t.includes('{')&&!t.includes('}'))r.push({line:i+1,msg:'可能缺少分号 <b>;</b>'});});return r;}, fix:'语句末尾加 <b>;</b>' },
  { name:'未设引脚模式', check:(c)=>{if((c.includes('digitalWrite')||c.includes('digitalRead'))&&!c.includes('pinMode'))return[{line:1,msg:'使用I/O但没<b>pinMode()</b>'}];return[];}, fix:'setup()里加 pinMode(引脚, OUTPUT/INPUT);' },
  { name:'缺少setup/loop', check:(c)=>{const r=[];if(!c.includes('void setup'))r.push({line:1,msg:'缺少<b>void setup()</b>'});if(!c.includes('void loop'))r.push({line:1,msg:'缺少<b>void loop()</b>'});return r;}, fix:'Arduino程序必须有setup()和loop()' },
  { name:'括号不匹配', check:(c)=>{let o=0;for(const ch of c){if(ch==='{')o++;if(ch==='}')o--;}if(o!==0)return[{line:1,msg:`大括号不匹配(多${o>0?o:Math.abs(o)}个${o>0?'{':'}'})`}];return[];}, fix:'确保每个{有对应}' },
  { name:'圆括号不匹配', check:(c)=>{let o=0;for(const ch of c){if(ch==='(')o++;if(ch===')')o--;}if(o!==0)return[{line:1,msg:`圆括号不匹配(多${o>0?o:Math.abs(o)}个${o>0?'(':')'})`}];return[];}, fix:'确保每个(有对应)' },
  { name:'digitalWrite值错误', check:(c)=>{const r=[];const re=/digitalWrite\s*\([^,]+,\s*(\d+)\s*\)/g;let m;while((m=re.exec(c))!==null){if(m[1]!=='0'&&m[1]!=='1')r.push({line:0,msg:`digitalWrite参数应为HIGH/LOW，不是${m[1]}`});}return r;}, fix:'digitalWrite只用HIGH(开)或LOW(关)' },
  { name:'ESP32用错PWM', check:(c)=>{if(c.includes('analogWrite')&&(c.includes('ledc')||c.includes('ESP32')||c.includes('esp32')))return[{line:0,msg:'⚠️ ESP32不支持analogWrite，用ledcWrite'}];return[];}, fix:'用ledcSetup+ledcAttachPin+ledcWrite' },
  { name:'Serial未初始化', check:(c)=>{if((c.includes('Serial.print')||c.includes('Serial.println'))&&!c.includes('Serial.begin'))return[{line:0,msg:'用了串口但没<b>Serial.begin()</b>'}];return[];}, fix:'setup()里加Serial.begin(115200);' },
  { name:'if里用=不是==', check:(c)=>{const r=[];c.split('\n').forEach((l,i)=>{if(l.includes('if')&&l.match(/if\s*\([^=]*=[^=]/)&&!l.includes('==')&&!l.includes('!=')&&!l.includes('<')&&!l.includes('>'))r.push({line:i+1,msg:'if里用了<b>=</b>(赋值)，应该是<b>==</b>(比较)'});});return r;}, fix:'等于比较用==，赋值用=' },
  { name:'缺少库引用', check:(c)=>{const r=[];const n={Servo:'#include <Servo.h>',LiquidCrystal:'#include <LiquidCrystal.h>',WiFi:'#include <WiFi.h>'};for(const[k,v]of Object.entries(n)){if(c.includes(k)&&!c.includes('#include'))r.push({line:0,msg:`用了<b>${k}</b>但没包含库：${v}`});}return r;}, fix:'代码开头加#include <库名.h>' },
];

function analyzeErrors() {
  const code = document.getElementById('debug-code').value.trim();
  const errText = document.getElementById('debug-error').value.trim();
  const output = document.getElementById('debug-output');
  if (!code && !errText) { output.innerHTML = '<span class="warn">⚠️ 请粘贴代码或错误信息</span>'; return; }

  let html = '';
  let total = 0;

  if (errText) {
    html += '<div style="margin-bottom:8px;"><b>🔍 编译器报错：</b></div>';
    for (const line of errText.split('\n')) {
      const t = line.trim(); if (!t) continue;
      const m = t.match(/(.+):(\d+):(\d+):\s*(error|warning):\s*(.+)/i);
      if (m) {
        html += `<div class="error-card"><div class="err-type">❌ 第${m[2]}行</div><div class="err-msg">${escapeHtml(m[5])}</div>`;
        if (m[5].includes('not declared')) { const v=m[5].match(/'(\w+)'/); html+=`<div class="err-fix">💡 <b>${v?.[1]||'变量'}</b>未声明，检查拼写或加类型声明</div>`; }
        else if (m[5].includes('expected')) { const e=m[5].match(/expected\s+'([^']+)'/); html+=`<div class="err-fix">💡 缺少<b>${e?.[1]||''}</b>，补上即可</div>`; }
        html += '</div>'; total++;
      }
    }
  }

  if (code) {
    html += '<div style="margin:8px 0;"><b>🔍 规则检测：</b></div>';
    for (const rule of ERROR_PATTERNS) {
      try {
        for (const r of rule.check(code)) {
          html += `<div class="error-card"><div class="err-type">⚠️ ${rule.name}</div><div class="err-msg">${r.line>0?'第'+r.line+'行：':''}${r.msg}</div><div class="err-fix">💡 ${rule.fix}</div></div>`;
          total++;
        }
      } catch(e) {}
    }
  }

  if (total === 0) {
    html += '<div class="success" style="font-size:16px;text-align:center;padding:20px;">✅ 没检测到明显错误！</div>';
  } else {
    html = `<div style="margin-bottom:8px;">发现 <span class="error">${total}</span> 个问题：</div>` + html;
    html += '<div style="margin-top:10px;padding:10px;background:#1a1a2a;border-radius:8px;font-size:13px;"><div class="info">💡 检查清单：</div>1️⃣ 每条语句末尾有<b>;</b>吗？ 2️⃣ 括号<b>{}</b>成对吗？ 3️⃣ 引脚设pinMode了吗？ 4️⃣ 变量声明类型了吗？ 5️⃣ 比较用<b>==</b>不是<b>=</b></div>';
  }
  output.innerHTML = html;
}

  localStorage.setItem('ai_api_key', document.getElementById('api-key').value.trim());
  localStorage.setItem('ai_api_model', document.getElementById('api-model').value.trim());
  alert('✅ 配置已保存');
}

// ==================== 速查手册 ====================
function renderQuickRef() {
  let h = '<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;">';
  for (const [fn,d] of Object.entries(ARDUINO_DOC)) {
    h += `<div style="background:#1a2332;padding:10px;border-radius:8px;border-left:3px solid var(--accent2);font-size:12px;">
      <b style="color:var(--accent2);">${fn}()</b>
      <div style="color:#ccc;margin:2px 0;">${d.desc}</div>
      <div style="color:var(--text2);font-size:11px;">${d.params}</div>
      ${d.note?`<div style="color:var(--yellow);font-size:11px;">${d.note}</div>`:''}
    </div>`;
  }
  h += '</div><div style="margin-top:12px;"><b style="color:var(--accent2);">📐 结构速查</b></div><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:6px;">';
  for (const [k,d] of Object.entries(ARDUINO_STRUCTURE)) {
    h += `<div style="background:#1a1a2e;padding:8px;border-radius:8px;font-size:12px;"><b style="color:#d2a8ff;">${k}</b><br><span style="color:#aaa;">${d}</span></div>`;
  }
  h += '</div>';
  document.getElementById('quickref-content').innerHTML = h;
}

// ==================== 初始化 ====================
function init() {
  renderTemplates();
  renderQuickRef();
  const url = localStorage.getItem('ai_api_url') || PRESET_API.url;
  const key = localStorage.getItem('ai_api_key') || PRESET_API.key;
  const model = localStorage.getItem('ai_api_model') || PRESET_API.model;
  document.getElementById('api-url').value = url;
  document.getElementById('api-key').value = key;
  document.getElementById('api-model').value = model;
  if (!localStorage.getItem('ai_api_url')) {
    localStorage.setItem('ai_api_url', PRESET_API.url);
    localStorage.setItem('ai_api_key', PRESET_API.key);
    localStorage.setItem('ai_api_model', PRESET_API.model);
  }
  // 注册 Service Worker
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('./sw.js').catch(() => {});
  }
}

window.addEventListener('DOMContentLoaded', init);
</script>
